services:
  alphaforge:
    build:
      # 构建上下文是仓库根目录，Dockerfile 在 deploy/ 下
      context: ..
      dockerfile: deploy/Dockerfile
    image: alphaforge:0.5.0
    container_name: alphaforge
    restart: unless-stopped
    ports:
      - "${AF_PORT:-8000}:8000"
    environment:
      AF_END_DATE: ${AF_END_DATE:-2026-11-06}
      AF_BARS: ${AF_BARS:-520}
      AF_SALT: ${AF_SALT:-v1}
      AF_STORE_PATH: /app/data/store.json
      AF_CORS_ORIGINS: ${AF_CORS_ORIGINS:-http://localhost:8000}
    volumes:
      - alphaforge-data:/app/data

volumes:
  alphaforge-data:
