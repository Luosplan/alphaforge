# 宝塔：网站 → 你的域名 → 设置 → 配置文件，把下面的 location 段贴进 server{} 里。
# 如果先用「反向代理」功能生成了基础配置，把这里的两条 proxy_read_timeout 补上即可
# （宝塔默认 60 秒，而「同步日线」这类接口要跑几分钟）。

# 前端产物与接口在同一个进程里，全部转发给 uvicorn
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";

    # 数据同步接口是同步执行的（首次全量约 19 分钟），超时给足；
    # 60 秒会让页面报 504，而服务端其实还在跑，第二次点又会重跑一遍。
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # 上游是 uvicorn，压缩交给 Nginx 做（1MB 的 echarts chunk 压完 ~350KB）
    proxy_set_header Accept-Encoding "";
}

gzip on;
# 静态资源是 uvicorn 直接吐出来的，不加 any 的话 gzip 只对 Nginx 自己的文件生效
gzip_proxied any;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript
           application/x-javascript text/xml application/xml image/svg+xml;

client_max_body_size 50m;
