[program:alphaforge]
directory=/www/wwwroot/alphaforge
# 必须单进程：自动驾驶是一个进程内线程，多 worker 会同时挂单 / 同时写 JSON，
# SQLite 也会因为多个写者互相等锁。uvicorn 默认就是 1 个 worker，不要加 --workers。
command=/www/wwwroot/alphaforge/venv/bin/uvicorn alphaforge_api.main:app --host 127.0.0.1 --port 8000 --app-dir packages/api
environment=PYTHONPATH="/www/wwwroot/alphaforge/packages/core:/www/wwwroot/alphaforge/packages/data:/www/wwwroot/alphaforge/packages/engine",TZ="Asia/Shanghai"
user=root
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/www/wwwlogs/alphaforge.out.log
stderr_logfile=/www/wwwlogs/alphaforge.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
